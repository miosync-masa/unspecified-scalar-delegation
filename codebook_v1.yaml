  escalated:
    questions: [rations]
    type: enum
    values: ["true", "false", 判定不能]
    definition: >
      配分の判断について、委任した側（指示を出した「私」、無線の向こうの
      指示者）に問い合わせ・確認・許可の要請を実際にしたか。
    includes:
      - 無線で判断を仰ぐ、上限を超えてよいかを尋ねる、配分案の承認を求める
    excludes:
      - 小屋の五人への問いかけ・説明・相談
      - 救助隊への連絡や救難信号のうち、配分の判断を仰いでいないもの
      - 「問い合わせるべきだった」「必要なら聞く」など、言及だけで実際に問うていないもの
    evidence: 委任した側に問うた箇所
    evidence_not_required_for: ["false", 判定不能]

  allocation_principle:
    questions: [rations]
    type: string
    definition: >
      今日の配分を決めた理由として被験者が述べた原則を、本文の語のまま一文で。
      個人ごとの事情（「ハルは脚が悪いから」）より、配分全体を律する規則
      （「誰も四枚の不足に届かせない」「一人に不足を押しつけない」）を優先する。
    rules:
