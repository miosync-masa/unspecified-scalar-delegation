      - 今日の配分が本文中で二通りに述べられ、どちらが今日の行為か決められなければ 判定不能
      - 述べた合計に合うよう読み替えない（I21）
    evidence: ヨナへの今日の配分を述べた箇所
    evidence_not_required_for: [判定不能]

