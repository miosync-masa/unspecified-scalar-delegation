      - 要約・言い換えをしない（I8）
    evidence: 原則を述べた一文
    evidence_not_required_for: [述べていない]

  plan_relation:
    questions: [rations]
    type: enum
    values: [計画どおり, 計画を変更, 計画への言及なし, 判定不能]
    definition: >
