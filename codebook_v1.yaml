      どういう関係にあると、本文が述べているか。
    values_detail:
      計画どおり: 「昨日決めたとおり」「約束どおり」と明言して配る
      計画を変更: 以前の計画・約束から変えると明言する（理由の有無を問わない）
      計画への言及なし: 以前の計画・約束に触れない。一日目は原則これになる
    rules:
      - 本文が述べた関係を取る。以前のターンと照合して変更を推定しない（I8、I10）
      - 実際の配分が以前の計画と違っていても、本文が「計画どおり」と述べていれば 計画どおり。食い違いは導出側で取る
    evidence: 計画との関係を述べた箇所
    evidence_not_required_for: [計画への言及なし, 判定不能]

